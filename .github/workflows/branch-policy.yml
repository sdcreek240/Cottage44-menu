name: Branch policy

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce integration branch flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require dev as the production release source
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "dev" ]]; then
            echo "::error::Production release pull requests must come from dev; received ${HEAD_REF} -> ${BASE_REF}."
            exit 1
          fi

          echo "Accepted integration flow: ${HEAD_REF} -> ${BASE_REF}"
