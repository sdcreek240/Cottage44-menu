name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests and collect JavaScript coverage
        run: npm run coverage
      - name: Type-check and check static files
        run: npm run check
      - name: Build Pages Functions
        run: npm run build
      - name: Upload JavaScript coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-coverage
          path: |
            coverage/lcov.info
            coverage/summary.txt
          if-no-files-found: warn
          retention-days: 14

  migration_changes:
    name: Detect Supabase migration changes
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed migrations
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE" =~ ^0{40}$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$GITHUB_SHA" -- supabase/migrations/)"
          else
            changed_files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/migrations/)"
          fi

          if [[ -n "$changed_files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  supabase_migrations:
    name: Apply Supabase migrations
    needs: migration_changes
    if: needs.migration_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Cottage44_menu' || 'Cottage44_menu_preview' }}
    concurrency:
      group: supabase-migrations-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project and apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD, plus SUPABASE_PROJECT_REF, in the branch-specific Supabase environment."
            exit 1
          fi

          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes

  codecov:
    name: Upload coverage to Codecov
    needs: checks
    if: needs.checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Cottage44_menu
    permissions:
      contents: read
    steps:
      - name: Check out repository for source and Codecov configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download JavaScript coverage report
        uses: actions/download-artifact@v4
        with:
          name: javascript-coverage
          path: coverage
      - name: Upload JavaScript coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          cleanup: true
          name: docs-menu-js
