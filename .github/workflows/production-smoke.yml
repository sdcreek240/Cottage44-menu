name: Production smoke tests

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: production-smoke-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://menu.cottage44.co.za
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the Cloudflare Pages deployment check
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            check_state="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Cloudflare Pages") | (.status + ":" + (.conclusion // ""))] | last // empty')"

            case "$check_state" in
              completed:success)
                echo "Cloudflare Pages deployment check passed for ${COMMIT_SHA}."
                exit 0
                ;;
              completed:*)
                echo "::error::Cloudflare Pages deployment check did not succeed: ${check_state}."
                exit 1
                ;;
              *)
                echo "Waiting for Cloudflare Pages deployment check (attempt ${attempt}/20)."
                sleep 15
                ;;
            esac
          done

          echo "::error::Cloudflare Pages deployment check did not complete within five minutes."
          exit 1

      - name: Smoke-test the production frontend
        run: |
          set -euo pipefail
          homepage="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "${PRODUCTION_URL}/")"
          grep -q "Cottage 44" <<<"$homepage"

      - name: Smoke-test the production API
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "${PRODUCTION_URL}/api/health")"
          grep -q '"status":"ok"' <<<"$health"
