name: Cloudflare Pages preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - dev
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose merge archive should be previewed
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Cottage44_menu
    env:
      PREVIEW_PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
    steps:
      - name: Download pull request application files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p preview
          curl --fail-with-body --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/refs/pull/${PREVIEW_PR_NUMBER}/merge" \
            --output /tmp/pull-request.zip
          unzip -q /tmp/pull-request.zip -d /tmp/pull-request
          source_dir="$(find /tmp/pull-request -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_dir"
          test -s "$source_dir/docs/index.html"
          test -s "$source_dir/functions/api/health.ts"
          cp -R "$source_dir/docs/." preview/
          cp -R "$source_dir/functions" preview/

      - name: Validate Cloudflare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the Cottage44_menu environment."
            exit 1
          fi

      - name: Deploy Cloudflare Pages application preview
        id: publish
        uses: cloudflare/wrangler-action@v3
        working-directory: preview
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.148.0
          command: pages deploy . --project-name=cottage44-menu-pages --branch=pr-${{ env.PREVIEW_PR_NUMBER }}

      - name: Smoke-test the deployed application
        env:
          PREVIEW_URL: https://pr-${{ env.PREVIEW_PR_NUMBER }}.cottage44-menu-pages.pages.dev
        run: |
          set -euo pipefail
          homepage="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$PREVIEW_URL/")"
          grep -q "Cottage 44" <<<"$homepage"

          health="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$PREVIEW_URL/api/health")"
          grep -q '"status":"ok"' <<<"$health"

      - name: Add preview link to the pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://pr-${{ env.PREVIEW_PR_NUMBER }}.cottage44-menu-pages.pages.dev
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const body = `${marker}
            Cloudflare Pages preview: [Open the deployed site](${process.env.PREVIEW_URL})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
