name: Cloudflare Pages preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - dev
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose merge archive should be previewed
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Cottage44_menu_preview
    env:
      PREVIEW_PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
    steps:
      - name: Download pull request application files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p preview
          curl --fail-with-body --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/refs/pull/${PREVIEW_PR_NUMBER}/merge" \
            --output /tmp/pull-request.zip
          unzip -q /tmp/pull-request.zip -d /tmp/pull-request
          source_dir="$(find /tmp/pull-request -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_dir"
          test -s "$source_dir/docs/index.html"
          test -s "$source_dir/functions/api/health.ts"
          test -s "$source_dir/supabase/config.toml"
          test -d "$source_dir/supabase/migrations"
          cp -R "$source_dir/docs/." preview/
          cp -R "$source_dir/functions" preview/
          mkdir -p /tmp/preview-supabase/supabase
          cp "$source_dir/supabase/config.toml" /tmp/preview-supabase/supabase/config.toml
          cp -R "$source_dir/supabase/migrations" /tmp/preview-supabase/supabase/

      - name: Validate Cloudflare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the Cottage44_menu_preview environment."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize preview Supabase database
        working-directory: /tmp/preview-supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD, plus SUPABASE_PROJECT_REF, in the Cottage44_menu_preview environment."
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_REF" != "kawfjlfizboizpqjcidz" ]]; then
            echo "::error::Refusing to migrate a Supabase project other than the verified preview project."
            exit 1
          fi

          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes

      - name: Deploy Cloudflare Pages application preview
        id: publish
        working-directory: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Deploying the preview with Wrangler 4.148.0."
          npx --yes wrangler@4.148.0 pages deploy . \
            --project-name=cottage44-menu-pages \
            --branch="pr-${PREVIEW_PR_NUMBER}" |
            tee "/tmp/wrangler-pages-deploy-${PREVIEW_PR_NUMBER}.log"

          deployment_url="$(grep -Eo 'https://[[:alnum:].-]+\.pages\.dev' \
            "/tmp/wrangler-pages-deploy-${PREVIEW_PR_NUMBER}.log" | tail -n 1)"
          if [[ -z "$deployment_url" ]]; then
            echo "::error::Wrangler completed without reporting a Pages deployment URL."
            exit 1
          fi
          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the deployed application
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          set -euo pipefail
          homepage="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$PREVIEW_URL/")"
          grep -q "Cottage 44" <<<"$homepage"

          health="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$PREVIEW_URL/api/health")"
          grep -q '"status":"ok"' <<<"$health"

          plates_status="$(curl --silent --show-error --output /tmp/preview-plates-today.json \
            --write-out '%{http_code}' --retry 10 --retry-delay 3 --retry-all-errors \
            "$PREVIEW_URL/api/plates/today")"
          if [[ "$plates_status" != "200" ]]; then
            echo "::error::The deployed public plates API returned HTTP $plates_status."
            cat /tmp/preview-plates-today.json
            exit 1
          fi
          jq -e 'type == "object" and has("plate") and has("nextPlate")' \
            /tmp/preview-plates-today.json >/dev/null

      - name: Add preview link to the pull request
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://pr-${{ env.PREVIEW_PR_NUMBER }}.cottage44-menu-pages.pages.dev
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const body = `${marker}
            Cloudflare Pages preview: [Open the deployed site](${process.env.PREVIEW_URL})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
